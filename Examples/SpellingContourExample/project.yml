name: SpellingContourExample
options:
  bundleIdPrefix: com.muilyzz
packages:
  PitchKit:
    path: ../..
  PhraseLatticeKit:
    url: https://github.com/Muilyzz/PhraseLatticeKit.git
    from: 2.7.0
targets:
  SpellingContourExample:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources]
    dependencies:
      - package: PitchKit
        product: PitchKit
      - package: PhraseLatticeKit
        product: PhraseLattice
      - package: PhraseLatticeKit
        product: PhraseLatticeUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
